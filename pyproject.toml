[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jocky"
version = "0.2.0"
description = "JOCKY: a forensic scripting language and framework for computer & network forensic analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lark>=1.1.9",
    "numpy>=2.0,<3",
    "pydantic>=2.7",
    "cryptography>=42.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["jocky*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.alembic]
script_location = "migrations"